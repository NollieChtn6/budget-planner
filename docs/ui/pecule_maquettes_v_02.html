<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pécule, maquettes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
/* ===== Jetons de la charte ===== */
:root{
  --bg:#F4F5F1; --surface:#FCFCFA; --soft:#ECEEE8; --line:#D6DAD3;
  --ink:#1C262E; --ink-2:#55616A;
  --accent:#7D5E1A; --accent-soft:#F1EAD8; --on-accent:#FCFCFA;
  --positive:#2F6B4F; --negative:#A3322A;
  --a-ok:#3E7D55; --a-watch:#6F8A22; --a-caution:#A88412; --a-warning:#C0622A; --a-critical:#B8392F; --a-exceeded:#6E4A9E;
  --serif:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --sans:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-s:4px; --r-m:8px; --r-l:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#14181B; --surface:#1B2024; --soft:#232A2F; --line:#323A40;
  --ink:#E6E8E3; --ink-2:#9AA3A8;
  --accent:#D4B36A; --accent-soft:#3A321F; --on-accent:#14181B;
  --positive:#7DC39A; --negative:#EE8A80;
  --a-ok:#5FAE7A; --a-watch:#A7BD52; --a-caution:#D6B23C; --a-warning:#E08A4F; --a-critical:#E8665C; --a-exceeded:#A98BDB;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14181B; --surface:#1B2024; --soft:#232A2F; --line:#323A40;
  --ink:#E6E8E3; --ink-2:#9AA3A8;
  --accent:#D4B36A; --accent-soft:#3A321F; --on-accent:#14181B;
  --positive:#7DC39A; --negative:#EE8A80;
  --a-ok:#5FAE7A; --a-watch:#A7BD52; --a-caution:#D6B23C; --a-warning:#E08A4F; --a-critical:#E8665C; --a-exceeded:#A98BDB;
  color-scheme:dark;
}

/* ===== Base ===== */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;margin:0}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.amount{font-family:var(--serif);font-weight:500;font-variant-numeric:tabular-nums lining-nums}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--negative)} .pos{color:var(--positive)}
.sub,.note{font-size:13px;color:var(--ink-2)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.level{display:inline-flex;align-items:center;gap:7px}
[hidden]{display:none!important}

/* ===== Boutons, champs, badges ===== */
.btn{font:600 14px var(--sans);border-radius:var(--r-m);padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover{opacity:.9;background:var(--ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.accent:hover{opacity:.92;background:var(--accent)}
.btn.link,.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2);padding:6px 8px;font-weight:500}
.btn.link:hover,.btn.quiet:hover{color:var(--ink);background:var(--soft)}
.btn.danger{color:var(--negative)}
.btn:disabled{opacity:.4;cursor:not-allowed}
kbd{font:500 11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:var(--r-s);padding:0 5px;line-height:17px;color:var(--ink-2);background:var(--surface)}
.btn.primary kbd,.btn.accent kbd{background:transparent;color:inherit;border-color:currentColor;opacity:.65}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--sans);padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface);white-space:nowrap}
.chip.good{color:var(--positive);border-color:currentColor}
.chip.bad{color:var(--negative);border-color:currentColor}
.chip.acc{color:var(--accent);border-color:currentColor;background:var(--accent-soft)}
label.f{display:block;margin-bottom:14px}
label.f>span{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;margin-bottom:6px}
input,select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:8px 11px;width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:var(--ink)}
.warn{border:1px solid var(--line);border-left:3px solid var(--a-warning);background:var(--surface);padding:10px 14px;border-radius:var(--r-m);font-size:14px;margin:14px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px}

/* ===== Connexion ===== */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth-card{width:min(400px,100%)}
.auth .brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.auth .brand svg{width:40px;height:40px;color:var(--accent)}
.auth .brand span{font:500 48px/1 var(--serif);letter-spacing:-.03em}
.auth .tagline{font:italic 400 18px var(--serif);color:var(--ink-2);margin-bottom:32px}
.auth .panel{padding:24px}
.auth h2{font-size:22px;margin-bottom:6px}
.auth .panel>p{margin-bottom:18px}
.code-input{font:500 24px var(--mono);letter-spacing:.4em;text-align:center}

/* ===== Coquille ===== */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
aside.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.side .logo{display:flex;align-items:center;gap:9px;font:500 24px var(--serif);letter-spacing:-.02em;margin:0 8px 22px}
.side .logo svg{width:24px;height:24px;color:var(--accent)}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav button{display:flex;align-items:center;justify-content:space-between;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:var(--r-m);color:var(--ink-2);cursor:pointer;font-size:14px;white-space:nowrap;gap:10px}
.side nav button:hover{background:var(--soft);color:var(--ink)}
.side nav button[aria-current="page"]{background:var(--soft);color:var(--ink);font-weight:600}
.side nav button small{display:block;font-size:12px;font-weight:400;color:var(--ink-2)}
.monthnav{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
.monthnav button{border:0;background:none;padding:6px 10px;cursor:pointer;color:var(--ink-2);font-size:15px}
.monthnav button:disabled{opacity:.3;cursor:default}
.monthnav span{font-weight:600;font-size:14px;padding:0 6px;min-width:120px;text-align:center}
tr.click{cursor:pointer}
.yearsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.yearsum div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px 16px;font-size:13px;color:var(--ink-2)}
.yearsum strong{display:block;font:500 22px var(--serif);color:var(--ink);font-variant-numeric:tabular-nums lining-nums;margin-top:2px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:var(--r-m);margin-bottom:20px;font-size:14px}
.side .foot{margin-top:auto;display:grid;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:5px 0;font:500 12px var(--sans);color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.user{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink-2);padding:0 4px;white-space:nowrap}
main#app{padding:36px 44px 72px;max-width:1240px;width:100%}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.page-head h1{font-size:34px;line-height:1.15}
.page-head .lead{color:var(--ink-2);margin-top:6px;max-width:62ch}
.page-head .lead .btn{margin-left:4px}
.head-actions{display:flex;gap:8px}
h3.sec{font-size:19px;margin:30px 0 12px;display:flex;align-items:baseline;gap:10px}
h3.sec:first-child{margin-top:0}
h3.sec .sub{font:400 13px var(--sans)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l)}
.pad{padding:18px 20px}
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:28px;align-items:start}

/* ===== Grille ===== */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;align-items:stretch}
.span12{grid-column:span 12}.span7{grid-column:span 7}.span5{grid-column:span 5}.span6{grid-column:span 6}
.dash>.panel{display:flex;flex-direction:column;min-width:0}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);min-height:56px}
.phead h3{font-size:18px}
.phead .sub{font-size:13px}
.fillrows{flex:1;display:flex;flex-direction:column}
.fillrows>.row,.fillrows>.mini{flex:1}
.dash .warn{margin:0}

/* ===== Mois ===== */
.remain{padding:22px 24px 20px}
.remain{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 48px;align-items:center}
.remain .split{margin:0}
.remain .stats{grid-column:1/-1;margin-top:16px}
.checks{grid-template-columns:3fr 1fr!important}
.checks .items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 28px}
.checks .col+.col .items{grid-template-columns:1fr}
.remain .big{font-size:52px;line-height:1.05;letter-spacing:-.02em;margin:4px 0 16px}
.stack{display:flex;gap:2px;height:8px;border-radius:99px;overflow:hidden;background:var(--soft)}
.split{display:grid;gap:7px;margin-top:14px;font-size:14px}
.split div{display:flex;align-items:center;gap:10px}
.split .num{margin-left:auto}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.stats div{font-size:13px;color:var(--ink-2)}
.stats strong{display:block;font:500 17px var(--serif);color:var(--ink);font-variant-numeric:tabular-nums lining-nums}
.row{display:grid;grid-template-columns:minmax(140px,190px) minmax(0,1fr) 120px;gap:20px;align-items:center;padding:15px 20px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .name{font-weight:600}
.track{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .35s ease}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
.row .state{font-size:13px;color:var(--ink-2);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.row .rest{text-align:right}
.row .rest .amount{font-size:19px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:12px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.mini{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 20px;border-top:1px solid var(--line);align-content:center;align-items:center}
.mini:first-child{border-top:0}
.mini .name{font-weight:600;font-size:14px}
.mini .track{grid-column:1/-1}
.mini .sub{grid-column:1/-1}
.checks{padding:4px 20px 14px;flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0 28px;align-content:start}
.checks .col{min-width:0}
.checks .grp{font-size:13px;color:var(--ink-2);margin:12px 0 4px}
.checks label{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:14px;cursor:pointer}
.checks .num{margin-left:auto;color:var(--ink-2);font-size:13px}
.done{color:var(--ink-2);text-decoration:line-through}
.closecard{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;flex-direction:row!important}

/* ===== Tableaux ===== */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--ink-2);font-size:13px;padding:11px 16px;border-bottom:1px solid var(--line)}
td{padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--soft)}
th.num,td.num{text-align:right}
td input,td select{padding:6px 9px;min-width:80px}
td .btn.link{padding:4px 6px}
.scroll{overflow-x:auto}
.tfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.filters{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.filters input{max-width:300px}
.filters select{max-width:240px}
.totals{display:flex;gap:28px;font-size:13px;color:var(--ink-2);margin-bottom:14px}
.totals strong{font:500 17px var(--serif);color:var(--ink);margin-left:6px}

/* ===== Provisions ===== */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pcard{padding:20px;display:flex;flex-direction:column;gap:12px}
.pcard .actions{margin-top:auto;padding-top:4px}
.pcard .top{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pcard h4{font-size:19px}
.pcard .bal{font-size:28px;line-height:1.1}
.pcard .bal small{font:400 14px var(--sans);color:var(--ink-2);margin-left:6px}
.pcard dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:13px}
.pcard dt{color:var(--ink-2)}
.pcard dd{margin:0;text-align:right}
.fill.acc{background:var(--accent)}

/* ===== Paramètres ===== */
.subnav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.subnav button{border:0;background:none;padding:9px 12px;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px;white-space:nowrap}
.subnav button[aria-current="true"]{color:var(--ink);border-color:var(--ink);font-weight:600}

/* ===== Dialogue, toast ===== */
dialog{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);color:var(--ink);padding:24px;width:min(460px,calc(100% - 32px));box-shadow:0 16px 40px rgba(20,24,27,.18)}
dialog::backdrop{background:rgba(20,24,27,.38)}
dialog h3{font-size:22px;margin-bottom:10px}
dialog p{color:var(--ink-2);font-size:14px;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:var(--r-m);font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(20,24,27,.25);z-index:20}

/* ===== Petits écrans ===== */
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  aside.side{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;align-items:center;flex-wrap:wrap;padding:10px 12px;gap:8px;border-right:0;border-bottom:1px solid var(--line)}
  .side .logo{margin:0 8px 0 4px;font-size:20px}
  .side nav{flex-direction:row;overflow-x:auto;flex:1;min-width:0}
  .side nav kbd,.side .foot,.head-actions kbd{display:none}
  main#app{padding:24px 16px 96px}
  .cols{grid-template-columns:1fr}
  .span7,.span5,.span6{grid-column:span 12}
  .checks,.checks .items{grid-template-columns:1fr!important}
  .remain{grid-template-columns:1fr}
  .row{grid-template-columns:1fr auto}
  .row .track-wrap{grid-column:1/-1;order:3}
  .stats,.yearsum{grid-template-columns:1fr 1fr}
  .remain .big{font-size:40px}
  .page-head h1{font-size:28px}
  .head-actions{position:fixed;right:16px;bottom:16px;z-index:6}
  .head-actions .btn{box-shadow:0 4px 14px rgba(20,24,27,.22)}
  .grid2{grid-template-columns:1fr}
  .toast{bottom:84px}
}
</style>
</head>
<body>
<div id="auth" class="auth"></div>
<div id="shell" class="shell" hidden>
  <aside class="side">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10.2"/><path d="M6.6 9.4 12 13.4l5.4-4"/><path d="M6.6 9.4v6.2h10.8V9.4"/></svg>Pécule</div>
    <nav id="nav" aria-label="Navigation principale"></nav>
    <div class="foot">
      <div class="seg" role="group" aria-label="Thème">
        <button data-theme-set="auto" aria-pressed="true">Auto</button><button data-theme-set="light" aria-pressed="false">Clair</button><button data-theme-set="dark" aria-pressed="false">Sombre</button>
      </div>
      <button class="btn link" data-act="logout" style="justify-self:start">Se déconnecter</button>
    </div>
  </aside>
  <main id="app"></main>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script>
// ===== Utilitaires =====
const MONTHS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const mLabel=i=>MONTHS[i%12]+" "+Math.floor(i/12);
const mTitle=i=>cap(mLabel(i));
const mShort=i=>MONTHS[i%12];
const eur=c=>(c/100).toLocaleString("fr-FR",{style:"currency",currency:"EUR"}).replace("-","−");
const toCents=v=>{const n=parseFloat(String(v).replace(/[\s  ]/g,"").replace(",","."));return isNaN(n)?0:Math.round(n*100)};
const toInput=c=>(c/100).toFixed(2).replace(".",",");
const esc=s=>String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
let seq=100; const uid=p=>p+(++seq);
const pad=n=>String(n).padStart(2,"0");
const dayIn=(m,d)=>`${Math.floor(m/12)}-${pad(m%12+1)}-${pad(d)}`;
const monthStart=m=>dayIn(m,1);
const monthEnd=m=>dayIn(m,new Date(Math.floor(m/12),m%12+1,0).getDate());
const fmtDate=iso=>{const [,mo,d]=iso.split("-");return `${d}/${mo}`;};
function defaultDate(){const t=new Date(),m=t.getFullYear()*12+t.getMonth();return m===S.cur?dayIn(S.cur,t.getDate()):monthStart(S.cur);}
const PALETTE=["#2A9D8F","#8D6E63","#4DB6C9","#3F6FB5","#B07A3E","#6F7F8C","#E35D6A","#F2A65A","#29B6F6","#9C6ADE","#E07BB5","#7A8F2E","#4F5BD5","#C2185B","#0F6E8C"];
const catDot=c=>c?`<span class="dot" style="background:${c.color}"></span>`:"";
const catTag=id=>{const c=S.categories.find(x=>x.id===id);return c?`<span class="level">${catDot(c)}${esc(c.label)}</span>`:"";};
const LEVELS=[
  {max:.5,label:"Tranquille",v:"--a-ok"},{max:.6,label:"À surveiller",v:"--a-watch"},
  {max:.75,label:"Attention",v:"--a-caution"},{max:.85,label:"Alerte",v:"--a-warning"},
  {max:1.0000001,label:"Presque vide",v:"--a-critical"},{max:Infinity,label:"Dépassement",v:"--a-exceeded"}];
function level(spent,budget){ if(budget<=0) return spent>0?LEVELS[5]:LEVELS[0]; return LEVELS.find(l=>spent/budget<l.max); }
let toastT; function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200);}

// ===== État =====
const START=2027*12+9;
const S={
  auth:false, authStep:1, tab:"month", setTab:"fixed", q:"", fcat:"", opsMonth:null, histYear:null, histMonth:null, today:null,
  cur:START, edit:null, status:"none", income:0, closing:false, alloc:{},
  fixed:[
    {id:"f1",label:"Loyer",type:"charge",amount:100000},{id:"f2",label:"Internet",type:"charge",amount:5000},
    {id:"f3",label:"Téléphone",type:"charge",amount:2000},{id:"f4",label:"Salle de sport",type:"charge",amount:3000},

// ===== Historique d'exemple : janvier 2024 à septembre 2027 =====
(function seed(){
  let r=20240101; const rnd=()=>{r|=0;r=r+0x6D2B79F5|0;let t=Math.imul(r^r>>>15,1|r);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const T=[["Biocoop","Courses de la semaine","c1","e1",2500,5500],["Monoprix","Produits d'entretien","c2","e1",800,2200],["Pharmacie","","c4","e1",600,2500],
    ["Animalerie","Croquettes","c5","e1",1500,3500],["Le Bistrot","Dîner","c7","e2",1800,4500],["Café des Arts","","c7","e2",400,1200],["Cinéma","Séance","c8","e2",900,1300],
    ["École de parapente","Navette","c9","e2",1500,4000],["Boutique Nuances","Vêtements","c10","e3",2500,9000],["Librairie","Livres","c12","e3",1200,3500],["Sephora","","c11","e3",1500,4000]];
  for(let m=2024*12;m<START;m++){
    const y=Math.floor(m/12), income=y===2024?265000:y===2025?272000:280000, quot=y===2024?12000:15000;
    const fixed=S.fixed.map(f=>({id:f.id,label:f.label,type:f.type,amount:f.amount,done:true}));
    const totalFixed=fixed.reduce((a,f)=>a+f.amount,0), reste=income-totalFixed, base=reste-quot;
    const env=[{id:"e1",label:"Vie quotidienne",mode:"amount",value:quot,budget:quot},
      {id:"e2",label:"Sorties et loisirs",mode:"percentage",value:15,budget:Math.floor(base*.15)},
      {id:"e3",label:"Achats plaisir",mode:"percentage",value:15,budget:Math.floor(base*.15)}];
    const n=7+Math.floor(rnd()*9);
    for(let k=0;k<n;k++){const t=T[Math.floor(rnd()*T.length)];
      S.ops.push({id:uid("o"),kind:"expense",month:m,date:dayIn(m,1+Math.floor(rnd()*27)),place:t[0],desc:t[1],cat:t[2],src:"env:"+t[3],amount:Math.round((t[4]+rnd()*(t[5]-t[4]))/10)*10,origin:"seed"});}
    const snap={fixed,env,prov:[],totalFixed,reste,base};
    const reliquat=env.reduce((a,e)=>a+e.budget-S.ops.filter(o=>o.month===m&&o.src==="env:"+e.id).reduce((x,o)=>x+o.amount,0),0);
    S.history.push({month:m,income,snap,reliquat,draw:reliquat<0?-reliquat:0,toSavings:Math.max(0,Math.floor(reliquat/1000)*1000)});
  }
  for(const x of [...S.fixed,...S.envelopes]) x.used=true;
  S.categories.forEach(c=>{ if(S.ops.some(o=>o.cat===c.id)) c.used=true; });
})();
S.today=START;

// ===== Domaine (simplifié) =====
const activeAt=(x,m)=>(x.from===undefined||x.from<=m)&&(x.archivedFrom===undefined||x.archivedFrom>m);
function provBalance(pid,beforeMonth){
  return S.ops.filter(o=>o.src==="prov:"+pid&&(beforeMonth===undefined||o.month<beforeMonth))
    .reduce((s,o)=>s+(o.kind==="contribution"?o.amount:-(o.amount-(o.draw||0))),0);
}
const dueMonth=p=>p.start+p.duration-1;
function provTarget(p,m){
  const bal=provBalance(p.id,m), left=Math.max(0,p.target-bal);
  if(p.type==="reserve") return Math.min(p.monthly,left);
  if(left===0) return 0;
  const rem=dueMonth(p)-m+1; return rem<=0?left:Math.ceil(left/rem);
}
const provActiveAt=(p,m)=>p.status!=="closed"&&(p.type==="reserve"||p.start<=m);
function buildSnap(prev){
  const m=S.cur, done=new Set(prev?prev.fixed.filter(f=>f.done).map(f=>f.id):[]);
  const fixed=S.fixed.filter(f=>activeAt(f,m)).map(f=>({id:f.id,label:f.label,type:f.type,amount:f.amount,done:done.has(f.id)}));
  const totalFixed=fixed.reduce((s,f)=>s+f.amount,0), reste=S.income-totalFixed;
  const envs=S.envelopes.filter(e=>activeAt(e,m));
  const base=reste-envs.filter(e=>e.mode==="amount").reduce((s,e)=>s+e.value,0);
  const env=envs.map(e=>({id:e.id,label:e.label,mode:e.mode,value:e.value,budget:e.mode==="amount"?e.value:(base>0?Math.floor(base*e.value/100):0)}));
  const prov=prev?prev.prov:S.provisions.filter(p=>provActiveAt(p,m)).map(p=>({id:p.id,label:p.label,target:provTarget(p,m)}));
  return {fixed,env,prov,totalFixed,reste,base};
}
const monthOps=(m=S.cur)=>S.ops.filter(o=>o.month===m);
const spentOn=(eid,m=S.cur)=>monthOps(m).filter(o=>o.kind==="expense"&&o.src==="env:"+eid).reduce((s,o)=>s+o.amount,0);
const contributedThisMonth=pid=>monthOps().filter(o=>o.kind==="contribution"&&o.src==="prov:"+pid).reduce((s,o)=>s+o.amount,0);
const margin=()=>{const s=S.snap;return s.reste-s.env.reduce((a,e)=>a+e.budget,0)-s.prov.reduce((a,p)=>a+p.target,0)};
const leftovers=()=>S.snap.env.map(e=>({...e,left:e.budget-spentOn(e.id)}));
function remaining(){
  const s=S.snap;
  const spentAll=monthOps().filter(o=>o.kind==="expense"&&o.src.startsWith("env:")).reduce((a,o)=>a+o.amount,0);
  const paidAll=monthOps().filter(o=>o.kind==="contribution").reduce((a,o)=>a+o.amount,0);
  const left=s.reste-spentAll-paidAll;
  const toSpend=s.env.reduce((a,e)=>a+Math.max(0,e.budget-spentOn(e.id)),0);
  const toPay=s.prov.reduce((a,t)=>a+Math.max(0,t.target-contributedThisMonth(t.id)),0);
  return {left,toSpend,toPay,free:left-toSpend-toPay};
}
function provState(p,t){
  const bal=provBalance(p.id), paid=contributedThisMonth(p.id), target=t?t.target:0, adv=paid-target;
  const late=p.type==="deadline"&&dueMonth(p)<S.cur&&bal<p.target&&p.status!=="closed";
  if(p.status==="closed") return `<span class="chip">Clôturée</span>`;
  if(late) return `<span class="chip bad">En retard</span>`;
  if(bal>=p.target&&p.target>0) return `<span class="chip good">Objectif atteint</span>`;
  if(!t) return `<span class="chip">Démarre en ${mShort(p.start)}</span>`;
  if(adv>0) return `<span class="chip good">Avance +${eur(adv)}</span>`;
  if(adv===0&&target>0) return `<span class="chip good">Cible du mois atteinte</span>`;
  return `<span class="chip">Reste ${eur(-adv)} ce mois</span>`;
}

// ===== Actions =====
function openMonth(income){
  S.income=income;
  for(const x of [...S.fixed,...S.envelopes]) if(x.next){Object.assign(x,x.next);delete x.next;}
  S.snap=buildSnap(null); S.status="open"; S.closing=false; S.alloc={};
  for(const x of [...S.fixed,...S.envelopes,...S.provisions]) if([...S.snap.fixed,...S.snap.env,...S.snap.prov].some(l=>l.id===x.id)) x.used=true;
  render(); toast(`${mTitle(S.cur)} ouvert`);
}
function addOp(op,edited){
  op.id=uid("o"); op.month=S.cur;
  const what=op.kind==="expense"?"Dépense":"Versement";
  if(op.kind==="expense"&&op.src.startsWith("prov:")){
    const pid=op.src.slice(5), bal=provBalance(pid);
    op.draw=Math.max(0,op.amount-Math.max(0,bal)); S.ops.push(op);
    const p=S.provisions.find(x=>x.id===pid);
    if(p.type==="deadline"&&provBalance(pid)<=0) askProvisionEnd(p,op.draw);
    else if(op.draw>0) info("Dépassement de la provision",`${eur(op.draw)} de cette dépense sont financés par l'épargne. Le solde de « ${esc(p.label)} » est à 0 €.`);
  } else S.ops.push(op);
  render(); toast(edited?`${what} enregistré${op.kind==="expense"?"e":""}`:`${what} ajouté${op.kind==="expense"?"e":""}`);
}
function closeMonth(){
  const m=S.cur;
  for(const [pid,amt] of Object.entries(S.alloc)) if(pid!=="savings"&&amt>0)
    S.ops.push({id:uid("o"),kind:"contribution",month:m,date:monthEnd(m),place:"",desc:"Répartition du reliquat",amount:amt,src:"prov:"+pid,origin:"closing"});
  const total=leftovers().reduce((s,e)=>s+e.left,0);
  S.history.push({month:m,income:S.income,snap:structuredClone(S.snap),reliquat:total,draw:total<0?-total:0,toSavings:S.alloc.savings||0});
  S.cur=m+1; S.status="none"; S.snap=null; S.closing=false; S.alloc={}; S.opsMonth=null;
  render(); toast(`${mTitle(m)} clôturé`);
}
function reopenMonth(m){
  const h=S.history.find(x=>x.month===m); if(!h||S.status!=="none"||m!==S.cur-1) return;
  S.ops=S.ops.filter(o=>!(o.month===m&&o.origin==="closing"));
  S.history=S.history.filter(x=>x!==h);
  S.cur=m; S.status="open"; S.snap=h.snap; S.income=h.income; S.alloc=h.toSavings?{savings:h.toSavings}:{};
  S.tab="month"; S.histMonth=null; render(); toast(`${mTitle(m)} rouvert`);
}
function histStats(h){
  const ops=monthOps(h.month), spent=ops.filter(o=>o.kind==="expense").reduce((a,o)=>a+o.amount,0);
  const saved=h.snap.fixed.filter(f=>f.type==="scheduledSaving").reduce((a,f)=>a+f.amount,0)+ops.filter(o=>o.kind==="contribution").reduce((a,o)=>a+o.amount,0)+h.toSavings;
  return {spent,saved};
}

// ===== Paramétrage : édition =====
const COLS={fixed:()=>S.fixed,env:()=>S.envelopes,prov:()=>S.provisions,cat:()=>S.categories};
const R7KEYS={fixed:["amount","type"],env:["mode","value"]};
function startEdit(col,id){S.edit={col,id,isNew:false,data:structuredClone(COLS[col]().find(x=>x.id===id))};render();document.querySelector('[data-f="label"]')?.focus();}
function startNew(kind){
  const T={fixed:{col:"fixed",data:{label:"",type:"charge",amount:0}},env:{col:"env",data:{label:"",mode:"amount",value:0}},
    deadline:{col:"prov",data:{label:"",type:"deadline",target:0,start:S.status==="none"?S.cur:S.cur+1,duration:6,status:"active"}},
    reserve:{col:"prov",data:{label:"",type:"reserve",target:0,monthly:0,status:"active"}},
    cat:{col:"cat",data:{label:"",color:PALETTE.find(h=>!S.categories.some(c=>c.color===h))||"#6F7F8C",def:""}}}[kind];
  const id=uid(kind[0]); S.edit={col:T.col,id,isNew:true,data:{id,...T.data}}; render(); document.querySelector('[data-f="label"]')?.focus();
}
function validateEdit(){
  const {col,id,data,isNew}=S.edit, list=COLS[col](), orig=list.find(x=>x.id===id), keys=R7KEYS[col];
  if(!data.label.trim()){document.querySelector('[data-f="label"]')?.focus();return;}
  const changed=keys&&(isNew||keys.some(k=>orig[k]!==data[k]));
  const commit=w=>{
    const later=w==="next"&&S.status==="open";
    if(isNew){if(later&&keys) data.from=S.cur+1; list.push(data);}
    else if(later&&changed){const nx={};keys.forEach(k=>{nx[k]=data[k];data[k]=orig[k];});Object.assign(orig,data,{next:nx});}
    else {Object.assign(orig,data); if(changed) delete orig.next;}
    S.edit=null;
    if(S.status==="open"&&keys&&!later) S.snap=buildSnap(S.snap);
    if(S.status==="open") for(const l of [...S.snap.fixed,...S.snap.env,...S.snap.prov]) if(l.id===id) l.label=data.label;
    render(); toast(isNew?"Élément ajouté":"Modification enregistrée");
  };
  if(S.status==="open"&&changed) askEffect(commit); else commit("now");
}
function isUsed(col,id){
  if(col==="cat") return S.ops.some(o=>o.cat===id);
  if(col==="env"&&S.ops.some(o=>o.src==="env:"+id)) return true;
  if(col==="prov"&&S.ops.some(o=>o.src==="prov:"+id)) return true;
  return !!COLS[col]().find(x=>x.id===id).used;
}
function askDelete(col,id){
  const x=COLS[col]().find(y=>y.id===id), used=isUsed(col,id), when=S.status==="none"?S.cur:S.cur+1;
  const verb=used?(col==="prov"?"Clôturer":"Archiver"):"Supprimer";
  const archText={fixed:`Ce poste apparaît déjà dans un mois budgétaire. Pour préserver l'historique, il sera archivé : il ne comptera plus à partir de ${mLabel(when)}.`,
    env:`Cette enveloppe apparaît déjà dans un mois budgétaire. Pour préserver l'historique, elle sera archivée : elle ne comptera plus à partir de ${mLabel(when)}.`,
    prov:"Cette provision a déjà un historique. Elle sera clôturée au lieu d'être supprimée.",
    cat:"Cette catégorie est utilisée par des dépenses. Elle sera archivée : elle ne sera plus proposée à la saisie, mais les dépenses la conservent."}[col];
  dlg.innerHTML=`<h3>${verb} « ${esc(x.label)} » ?</h3><p>${used?archText:"Cet élément n'a encore jamais servi : il sera supprimé définitivement."}</p>
    <div class="actions"><button class="btn ${used?"primary":"danger"}" data-del-confirm>${verb}</button><button class="btn quiet" data-close>Annuler</button></div>`;
  dlg._del=()=>{
    if(!used){const l=COLS[col](); l.splice(l.indexOf(x),1); if(col==="env") S.categories.forEach(c=>{if(c.def===id)c.def="";});}
    else if(col==="prov") x.status="closed"; else if(col==="cat") x.archived=true; else x.archivedFrom=when;
    toast(used?(col==="prov"?"Provision clôturée":"Élément archivé"):"Élément supprimé");
  };
  dlg.showModal();
}

const app=document.getElementById("app");
function render(){
  document.getElementById("auth").hidden=S.auth; document.getElementById("shell").hidden=!S.auth;
  if(!S.auth){ document.getElementById("auth").innerHTML=viewAuth(); return; }
  const items=[["month",`Ce mois-ci<small>${mLabel(S.cur)}</small>`,"1"],["ops","Opérations","2"],["prov","Provisions","3"],["hist","Historique","4"],["settings","Paramètres","5"]];
  document.getElementById("nav").innerHTML=items.map(([k,l,n])=>`<button data-tab="${k}" ${S.tab===k?'aria-current="page"':""}><span>${l}</span><kbd>${n}</kbd></button>`).join("");
  app.innerHTML=S.tab==="month"?viewMonth():S.tab==="ops"?viewOps():S.tab==="prov"?viewProv():S.tab==="hist"?(S.histMonth!==null?viewPastMonth(S.histMonth):viewHistory()):viewSettings();
}
const headActions=()=>S.status==="open"&&!S.closing?`<div class="head-actions"><button class="btn accent" data-add="contribution">Versement<kbd>V</kbd></button><button class="btn primary" data-add="expense">Ajouter une dépense<kbd>N</kbd></button></div>`:"";
const MARK=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10.2"/><path d="M6.6 9.4 12 13.4l5.4-4"/><path d="M6.6 9.4v6.2h10.8V9.4"/></svg>`;

function viewAuth(){
  return `<div class="auth-card">
    <div class="brand">${MARK}<span>Pécule</span></div>
    <p class="tagline">Mettre de côté, mois après mois.</p>
    <div class="panel" id="authf">${S.authStep===1?`
      <h2>Connexion</h2><p class="sub">Accès réservé à ton compte.</p>
      <label class="f"><span>Adresse e-mail</span><input name="email" type="email" autocomplete="username" placeholder="toi@exemple.fr"></label>
      <label class="f"><span>Mot de passe</span><input name="password" type="password" autocomplete="current-password"></label>
      <p class="note neg" id="autherr" hidden>Saisis ton adresse e-mail et ton mot de passe.</p>
      <div class="actions"><button class="btn primary" data-act="auth1" style="width:100%;justify-content:center">Se connecter</button></div>`:`
      <h2>Vérification</h2><p class="sub">Saisis le code à 6 chiffres affiché par ton application d'authentification.</p>
      <label class="f"><span>Code</span><input name="code" class="code-input" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"></label>
      <p class="note neg" id="autherr" hidden>Le code contient 6 chiffres.</p>
      <div class="actions"><button class="btn primary" data-act="auth2" style="width:100%;justify-content:center">Vérifier</button></div>
      <div class="actions" style="margin-top:8px;justify-content:space-between"><button class="btn link" data-act="authback">Retour</button><button class="btn link" data-act="auth2">Utiliser un code de secours</button></div>`}
    </div>
    <p class="note" style="margin-top:14px">Maquette : n'importe quels identifiants et n'importe quel code à 6 chiffres conviennent.</p>
  </div>`;
}

function viewMonth(){
  if(S.status==="none"){
    const closedPrev=S.history.find(h=>h.month===S.cur-1);
    const fx=S.fixed.filter(f=>activeAt(f,S.cur)).reduce((s,f)=>s+(f.next?.amount??f.amount),0);
    return `<div class="page-head"><div><h1>${mTitle(S.cur)}</h1><p class="lead">${closedPrev?`${cap(mLabel(S.cur-1))} est clôturé. `:""}Ce mois n'est pas encore ouvert.</p></div></div>
      <div class="panel pad" id="openf" style="max-width:480px">
        <h3 class="sec" style="margin-bottom:6px">Ouvrir le mois</h3>
        <p class="sub" style="margin-bottom:16px">Saisis le salaire qui finance ${mLabel(S.cur)} : Pécule calcule ton reste à vivre et le budget de chaque enveloppe.</p>
        <label class="f"><span>Revenu du mois</span><input name="income" inputmode="decimal" placeholder="2 800,00" value="${S.income?toInput(S.income):""}"></label>
        <div class="stats" style="grid-template-columns:1fr 1fr;margin-top:4px"><div>Postes fixes<strong>${eur(fx)}</strong></div><div>Reste à vivre<strong id="rav">—</strong></div></div>
        <p class="note neg" id="openerr" hidden style="margin-top:10px">Saisis un revenu supérieur à 0.</p>
        <div class="actions"><button class="btn primary" data-act="open">Ouvrir ${mLabel(S.cur)}</button></div>
      </div>`;
  }
  if(S.closing) return viewClosing();
  const s=S.snap, mg=margin(), R=remaining();
  const parts=[[R.toSpend,"var(--a-ok)"],[R.toPay,"var(--accent)"],[Math.max(0,R.free),"color-mix(in srgb,var(--ink-2) 45%,transparent)"]], tot=parts.reduce((a,[x])=>a+x,0)||1;
  const envRows=s.env.map(e=>{
    const sp=spentOn(e.id), lv=level(sp,e.budget), pct=e.budget>0?Math.min(100,sp/e.budget*100):(sp>0?100:0);
    return `<div class="row"><div><div class="name">${esc(e.label)}</div><div class="sub">${e.mode==="amount"?"Montant fixe":e.value+" % de la base"}</div></div>
      <div class="track-wrap"><div class="track"><div class="fill" style="width:${pct}%;background:var(${lv.v})"></div></div>
      <div class="state"><span class="level" style="color:var(--ink)"><span class="dot" style="background:var(${lv.v})"></span>${lv.label}</span><span>${eur(sp)} dépensés sur ${eur(e.budget)}</span></div></div>
      <div class="rest"><div class="amount ${e.budget-sp<0?"neg":""}">${eur(e.budget-sp)}</div><div class="sub">restant</div></div></div>`}).join("");
  const provRows=s.prov.map(t=>{
    const p=S.provisions.find(x=>x.id===t.id), bal=provBalance(p.id), pct=p.target>0?Math.min(100,bal/p.target*100):0;
    return `<div class="mini"><span class="name">${esc(p.label)}</span>${provState(p,t)}
      <div class="track"><div class="fill acc" style="width:${pct}%"></div></div>
      <span class="sub">${eur(bal)} sur ${eur(p.target)}, cible du mois ${eur(t.target)}</span></div>`}).join("");
  const grp=(type,title)=>{const l=s.fixed.filter(f=>f.type===type);return `<div class="col"><div class="grp">${title}</div><div class="items">`+l.map(f=>
    `<label><input type="checkbox" data-done="${f.id}" ${f.done?"checked":""}><span class="${f.done?"done":""}">${esc(f.label)}</span><span class="num">${eur(f.amount)}</span></label>`).join("")+`</div></div>`};
  const doneCount=s.fixed.filter(f=>f.done).length;
  const warns=[R.free<0?`Tes budgets, dépassements et versements dépassent de ${eur(-R.free)} ce que le mois permet. C'est un indicateur : rien n'est bloqué.`:"",
    s.base<0?"La base de répartition est négative : les enveloppes en pourcentage valent 0 €.":""].filter(Boolean);
  return `<div class="page-head"><div><h1>${mTitle(S.cur)}</h1>
      <p class="lead">${monthOps().length?`${monthOps().length} opération${monthOps().length>1?"s":""} ce mois-ci.`:"Rien de saisi pour l'instant. Ajoute ta première dépense."}
      ${monthOps().length||S.cur!==START?"":`<button class="btn link" data-act="demo">Charger l'exemple d'octobre</button>`}</p></div>${headActions()}</div>
    ${S.today>S.cur?`<div class="banner"><span><strong>${cap(mLabel(S.today))} a commencé.</strong> Clôture ${mShort(S.cur)} pour ouvrir ${mShort(S.cur+1)}.</span><button class="btn" data-act="closing">Clôturer ${mShort(S.cur)}</button></div>`
      :`<p class="note" style="margin:-16px 0 20px">Maquette : <button class="btn link" data-act="simulate" style="padding:0 2px">simuler l'arrivée de ${mLabel(S.cur+1)}</button></p>`}
    <div class="dash">
      ${warns.map(w=>`<div class="warn span12">${w}</div>`).join("")}
      <div class="panel remain span12">
        <div><div class="sub">Il te reste ce mois-ci</div>
        <div class="big amount ${R.left<0?"neg":""}">${eur(R.left)}</div>
        <div class="stack">${parts.map(([x,c])=>x>0?`<div style="width:${x/tot*100}%;background:${c}"></div>`:"").join("")}</div></div>
        <div class="split">
          <div><span class="dot" style="background:var(--a-ok)"></span>À dépenser dans les enveloppes<span class="num">${eur(R.toSpend)}</span></div>
          <div><span class="dot" style="background:var(--accent)"></span>À verser sur les provisions<span class="num">${eur(R.toPay)}</span></div>
          <div><span class="dot" style="background:color-mix(in srgb,var(--ink-2) 55%,transparent)"></span>Libre, non engagé<span class="num ${R.free<0?"neg":""}">${eur(R.free)}</span></div>
        </div>
        <div class="stats"><div>Revenu<strong>${eur(S.income)}</strong></div><div>Postes fixes<strong>${eur(s.totalFixed)}</strong></div><div>Reste à vivre<strong>${eur(s.reste)}</strong></div><div>Libre à l'ouverture<strong>${eur(mg)}</strong></div></div>
      </div>
      <div class="panel span7">
        <div class="phead"><h3>Enveloppes</h3><span class="sub">${eur(s.env.reduce((a,e)=>a+spentOn(e.id),0))} dépensés sur ${eur(s.env.reduce((a,e)=>a+e.budget,0))}</span></div>
        <div class="fillrows">${envRows}</div>
      </div>
      <div class="panel span5">
        <div class="phead"><h3>Provisions</h3><button class="btn link" data-tab="prov">Tout voir</button></div>
        <div class="fillrows">${provRows||'<p class="sub pad">Aucune provision active ce mois-ci.</p>'}</div>
      </div>
      <div class="panel span12">
        <div class="phead"><h3>Pointage</h3><span class="sub">${doneCount} sur ${s.fixed.length} effectués</span></div>
        <div class="checks">${grp("charge","Charges")}${grp("scheduledSaving","Épargne programmée")}</div>
      </div>
      <div class="panel closecard span12"><div><div style="font-weight:600">Fin du mois ?</div><div class="sub">Répartis le reliquat de tes enveloppes et verrouille ${mShort(S.cur)}.</div></div><button class="btn" data-act="closing">Clôturer ${mShort(S.cur)}</button></div>
    </div>`;
}

function viewClosing(){
  const lo=leftovers(), total=lo.reduce((s,e)=>s+e.left,0), allocated=Object.values(S.alloc).reduce((s,v)=>s+v,0);
  const provs=S.provisions.filter(p=>p.status!=="closed");
  return `<div class="page-head"><div><h1>Clôturer ${mLabel(S.cur)}</h1><p class="lead">Répartis ce qu'il reste. Une fois clôturé, le mois n'est plus modifiable, sauf réouverture.</p></div></div>
   <div class="dash">
   ${total<0?`<div class="warn span12">Le reliquat est négatif : ${eur(-total)} seront enregistrés comme financés par l'épargne.</div>`:""}
   ${allocated>Math.max(0,total)?`<div class="warn span12">Tu répartis ${eur(allocated-Math.max(0,total))} de plus que le reliquat. C'est possible, mais cet argent viendra d'ailleurs.</div>`:""}
   <div class="panel span6">
     <div class="phead"><h3>Reliquat par enveloppe</h3></div>
     <div style="flex:1"><table><thead><tr><th>Enveloppe</th><th class="num">Budget</th><th class="num">Dépensé</th><th class="num">Reliquat</th></tr></thead><tbody>
     ${lo.map(e=>`<tr><td>${esc(e.label)}</td><td class="num">${eur(e.budget)}</td><td class="num">${eur(e.budget-e.left)}</td><td class="num ${e.left<0?"neg":""}">${eur(e.left)}</td></tr>`).join("")}
     </tbody></table>
     <div class="stats" style="grid-template-columns:1fr 1fr;margin:0;padding:16px 20px">${(()=>{const ops=monthOps(),ex=ops.filter(o=>o.kind==="expense").reduce((a,o)=>a+o.amount,0),co=ops.filter(o=>o.kind==="contribution").reduce((a,o)=>a+o.amount,0);
       return `<div>Revenu<strong>${eur(S.income)}</strong></div><div>Postes fixes<strong>${eur(S.snap.totalFixed)}</strong></div><div>Dépensé<strong>${eur(ex)}</strong></div><div>Versé sur les provisions<strong>${eur(co)}</strong></div>`})()}</div></div>
     <div class="tfoot"><strong>Total</strong><span class="amount ${total<0?"neg":""}" style="font-size:22px">${eur(total)}</span></div>
   </div>
   <div class="panel span6">
     <div class="phead"><h3>Répartition</h3></div>
     <div style="flex:1"><table><tbody>
       <tr><td>Épargne</td><td style="width:140px"><input data-alloc="savings" inputmode="decimal" value="${S.alloc.savings?toInput(S.alloc.savings):""}" placeholder="0,00"></td></tr>
       ${provs.map(p=>`<tr><td>${esc(p.label)}<div class="sub">${eur(provBalance(p.id))} sur ${eur(p.target)}</div></td><td><input data-alloc="${p.id}" inputmode="decimal" value="${S.alloc[p.id]?toInput(S.alloc[p.id]):""}" placeholder="0,00"></td></tr>`).join("")}
     </tbody></table></div>
     <div class="tfoot"><span class="sub">Réparti</span><span class="amount" style="font-size:22px">${eur(allocated)} <span class="sub" style="font-family:var(--sans)">sur ${eur(Math.max(0,total))}</span></span></div>
   </div>
   <div class="panel closecard span12"><div class="sub">Tu pourras rouvrir ${mShort(S.cur)} depuis l'historique si tu dois corriger une opération.</div>
     <div style="display:flex;gap:8px"><button class="btn quiet" data-act="cancelclose">Revenir au mois</button><button class="btn primary" data-act="close">Clôturer ${mLabel(S.cur)}</button></div></div>
   </div>`;
}

const opsM=()=>S.opsMonth??S.cur;
const firstMonth=()=>S.history.length?Math.min(...S.history.map(h=>h.month)):S.cur;
function opsFiltered(){
  const q=S.q.trim().toLowerCase();
  return monthOps(opsM()).filter(o=>(!S.fcat||o.cat===S.fcat)&&(!q||[o.place,o.desc,S.categories.find(c=>c.id===o.cat)?.label].join(" ").toLowerCase().includes(q)))
    .sort((a,b)=>a.date.localeCompare(b.date));
}
function opsTable(){
  const envName=id=>S.envelopes.find(e=>e.id===id)?.label, provName=id=>S.provisions.find(p=>p.id===id)?.label;
  const src=s=>s.startsWith("env:")?esc(envName(s.slice(4))):`<span class="level"><span class="dot" style="background:var(--accent)"></span>${esc(provName(s.slice(5)))}</span>`;
  const list=opsFiltered(), editable=opsM()===S.cur&&S.status==="open";
  if(!list.length) return `<p class="sub pad">${monthOps(opsM()).length?"Aucune opération ne correspond à ta recherche.":opsM()===S.cur?"Aucune opération pour l'instant. Ajoute une dépense avec le bouton en haut à droite, ou la touche N.":"Aucune opération ce mois-là."}</p>`;
  return `<div class="scroll"><table><thead><tr><th>Date</th><th>Lieu</th><th>Description</th><th>Catégorie</th><th>Imputé à</th><th class="num">Montant</th>${editable?"<th></th>":""}</tr></thead><tbody>
   ${list.map(o=>`<tr><td class="num">${fmtDate(o.date)}</td><td>${esc(o.place)||`<span class="sub">${o.kind==="contribution"?"Versement":""}</span>`}</td>
     <td>${esc(o.desc)}${o.draw?` <span class="chip bad">${eur(o.draw)} via l'épargne</span>`:""}</td><td>${catTag(o.cat)}</td><td>${src(o.src)}</td>
     <td class="num ${o.kind==="contribution"?"pos":""}">${o.kind==="contribution"?"+":"−"}${eur(o.amount)}</td>
     ${editable?`<td class="num">${o.origin!=="closing"?`<button class="btn link" data-edit="${o.id}">Modifier</button><button class="btn link" data-del="${o.id}">Supprimer</button>`:""}</td>`:""}</tr>`).join("")}
   </tbody></table></div>`;
}
const monthNav=(m,min,max,act,label=true)=>`<div class="monthnav"><button data-${act}="${m-1}" ${m<=min?"disabled":""} aria-label="Mois précédent">‹${label?"":" "+cap(mShort(m-1))}</button>${label?`<span>${mTitle(m)}</span>`:""}<button data-${act}="${m+1}" ${m>=max?"disabled":""} aria-label="Mois suivant">${label?"":cap(mShort(m+1))+" "}›</button></div>`;
function viewOps(){
  const m=opsM(), ops=monthOps(m), closed=m<S.cur;
  const ex=ops.filter(o=>o.kind==="expense").reduce((a,o)=>a+o.amount,0), co=ops.filter(o=>o.kind==="contribution").reduce((a,o)=>a+o.amount,0);
  const head=`<div class="page-head"><div><h1>Opérations</h1><div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">${monthNav(m,firstMonth(),S.cur,"opsm")}${closed?`<span class="chip">Clôturé, lecture seule</span>`:""}</div></div>${m===S.cur?headActions():""}</div>`;
  if(m===S.cur&&S.status==="none") return head+`<p class="lead">Ouvre ${mLabel(S.cur)} pour saisir des opérations.</p>`;
  return head+`<div class="totals"><span>Dépensé<strong>${eur(ex)}</strong></span><span>Mis de côté<strong>${eur(co)}</strong></span></div>
   <div class="filters"><input id="search" type="search" placeholder="Rechercher un lieu, une description… (touche /)" value="${esc(S.q)}">
     <select id="fcat"><option value="">Toutes les catégories</option>${S.categories.map(c=>`<option value="${c.id}" ${S.fcat===c.id?"selected":""}>${esc(c.label)}</option>`).join("")}</select></div>
   <div class="panel" id="opstable">${opsTable()}</div>`;
}

function viewHistory(){
  if(!S.history.length) return `<div class="page-head"><div><h1>Historique</h1><p class="lead">Aucun mois clôturé pour l'instant. Tes mois apparaîtront ici une fois clôturés.</p></div></div>`;
  const years=[...new Set(S.history.map(h=>Math.floor(h.month/12)))].sort((a,b)=>b-a), y=S.histYear??years[0];
  const list=S.history.filter(h=>Math.floor(h.month/12)===y).sort((a,b)=>b.month-a.month);
  const last=Math.max(...S.history.map(h=>h.month));
  let tI=0,tS=0,tV=0,tR=0;
  const rows=list.map(h=>{const st=histStats(h); tI+=h.income; tS+=st.spent; tV+=st.saved; tR+=h.reliquat;
    return `<tr class="click" data-hist="${h.month}" tabindex="0"><td><strong>${cap(mShort(h.month))}</strong>${h.month===last?` <span class="chip">Dernier clôturé</span>`:""}</td>
      <td class="num">${eur(h.income)}</td><td class="num">${eur(st.spent)}</td><td class="num">${eur(st.saved)}</td>
      <td class="num ${h.reliquat<0?"neg":""}">${h.reliquat>0?"+":""}${eur(h.reliquat)}${h.draw?` <span class="chip bad">via l'épargne</span>`:""}</td></tr>`}).join("");
  return `<div class="page-head"><div><h1>Historique</h1><p class="lead">Tes mois clôturés, consultables en lecture seule.</p></div>
      <div><select id="hyear" aria-label="Année" style="width:auto">${years.map(x=>`<option value="${x}" ${x===y?"selected":""}>${x}</option>`).join("")}</select></div></div>
    <div class="yearsum"><div>Revenus ${y}<strong>${eur(tI)}</strong></div><div>Dépensé<strong>${eur(tS)}</strong></div><div>Mis de côté<strong>${eur(tV)}</strong></div><div>Reliquats cumulés<strong class="${tR<0?"neg":""}">${eur(tR)}</strong></div></div>
    <div class="panel scroll"><table><thead><tr><th>Mois</th><th class="num">Revenu</th><th class="num">Dépensé</th><th class="num">Mis de côté</th><th class="num">Reliquat</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function viewPastMonth(m){
  const h=S.history.find(x=>x.month===m); if(!h){S.histMonth=null;return viewHistory();}
  const months=S.history.map(x=>x.month), last=Math.max(...months), st=histStats(h);
  const rows=h.snap.env.map(e=>{const sp=spentOn(e.id,m), lv=level(sp,e.budget), pct=e.budget>0?Math.min(100,sp/e.budget*100):0;
    return `<div class="row"><div><div class="name">${esc(e.label)}</div><div class="sub">${e.mode==="amount"?"Montant fixe":e.value+" % de la base"}</div></div>
      <div class="track-wrap"><div class="track"><div class="fill" style="width:${pct}%;background:var(${lv.v})"></div></div>
      <div class="state"><span class="level" style="color:var(--ink)"><span class="dot" style="background:var(${lv.v})"></span>${lv.label}</span><span>${eur(sp)} dépensés sur ${eur(e.budget)}</span></div></div>
      <div class="rest"><div class="amount ${e.budget-sp<0?"neg":""}">${eur(e.budget-sp)}</div><div class="sub">reliquat</div></div></div>`}).join("");
  const canReopen=m===last&&S.status==="none"&&m===S.cur-1;
  return `<div class="page-head"><div><button class="btn link" data-act="histback" style="padding-left:0">‹ Historique</button>
      <h1 style="margin-top:4px">${mTitle(m)} <span class="chip" style="vertical-align:middle">Clôturé</span></h1>
      <div style="margin-top:10px">${monthNav(m,Math.min(...months),last,"histm",false)}</div></div>
      <div class="head-actions">${m===last?(canReopen?`<button class="btn" data-act="reopen" data-month="${m}">Rouvrir pour corriger</button>`:`<span class="note" style="max-width:260px">Dans la maquette, la réouverture n'est possible que tant que ${mLabel(S.cur)} n'est pas ouvert.</span>`):""}<button class="btn" data-opsjump="${m}">Voir les opérations</button></div></div>
    <div class="stats panel pad" style="margin-top:0;border-top:1px solid var(--line)"><div>Revenu<strong>${eur(h.income)}</strong></div><div>Dépensé<strong>${eur(st.spent)}</strong></div><div>Mis de côté<strong>${eur(st.saved)}</strong></div><div>Reliquat<strong class="${h.reliquat<0?"neg":""}">${eur(h.reliquat)}</strong></div></div>
    ${h.draw?`<div class="warn">${eur(h.draw)} ont été financés par l'épargne à la clôture.</div>`:""}
    <h3 class="sec">Enveloppes</h3><div class="panel">${rows}</div>`;
}

function viewProv(){
  const tgt=id=>S.snap?.prov.find(t=>t.id===id);
  const card=p=>{
    const bal=provBalance(p.id), pct=p.target>0?Math.min(100,bal/p.target*100):0, t=tgt(p.id);
    return `<div class="panel pcard"><div class="top"><div><h4>${esc(p.label)}</h4><div class="sub">${p.type==="deadline"?`À échéance, ${mLabel(dueMonth(p))}`:"Réserve, sans échéance"}</div></div>${provState(p,t)}</div>
      <div class="bal amount">${eur(bal)}<small>sur ${eur(p.target)}</small></div>
      <div class="track"><div class="fill acc" style="width:${pct}%"></div></div>
      <dl>${p.type==="deadline"?`<dt>Période</dt><dd>${mShort(p.start)} à ${mLabel(dueMonth(p))}</dd>`:`<dt>Mensualité</dt><dd class="num">${eur(p.monthly)}</dd>`}
        ${t?`<dt>Cible de ${mShort(S.cur)}</dt><dd class="num">${eur(t.target)}</dd><dt>Versé ce mois</dt><dd class="num">${eur(contributedThisMonth(p.id))}</dd>`:""}</dl>
      ${S.status==="open"&&p.status!=="closed"?`<div class="actions" style="margin-top:4px"><button class="btn accent" data-pay="${p.id}">Verser</button><button class="btn quiet" data-spend="${p.id}">Dépenser</button></div>`:""}</div>`;
  };
  const active=S.provisions.filter(p=>p.status!=="closed"), closed=S.provisions.filter(p=>p.status==="closed");
  const totalBal=active.reduce((a,p)=>a+Math.max(0,provBalance(p.id)),0);
  return `<div class="page-head"><div><h1>Provisions</h1><p class="lead">L'argent mis de côté pour les dépenses prévues. Total disponible : <strong>${eur(totalBal)}</strong>.</p></div>
     <div class="head-actions"><button class="btn" data-goto-new="deadline">Nouvelle provision</button></div></div>
   <div class="pgrid">${active.map(card).join("")}</div>
   ${closed.length?`<h3 class="sec">Clôturées</h3><div class="pgrid">${closed.map(card).join("")}</div>`:""}`;
}

function viewSettings(){
  const E=S.edit, busy=!!E, open=S.status==="open";
  const editing=(col,id)=>E&&E.col===col&&E.id===id;
  const acts=(col,x)=>`<td class="num"><button class="btn link" data-edit-item="${col}:${x.id}" ${busy?"disabled":""}>Modifier</button>${x.archivedFrom!==undefined?"":`<button class="btn link" data-del-item="${col}:${x.id}" ${busy?"disabled":""}>Supprimer</button>`}</td>`;
  const ok=`<td class="num"><button class="btn primary" data-act="validate">Valider</button><button class="btn quiet" data-act="cancel-edit">Annuler</button></td>`;
  const inp=(f,v,extra="")=>`<input data-f="${f}" value="${esc(v)}" ${extra}>`;
  const sel=(f,v,opts)=>`<select data-f="${f}">${opts.map(([k,l])=>`<option value="${k}" ${k===v?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
  const status=x=>x.archivedFrom!==undefined?`<div class="sub">Archivé à partir de ${mLabel(x.archivedFrom)}${x.archivedFrom>S.cur||(!open&&x.archivedFrom===S.cur)?` <button class="btn link" data-unarch="${x.id}">Annuler l'archivage</button>`:""}</div>`
    :x.from!==undefined&&x.from>S.cur?`<div class="sub">Actif à partir de ${mLabel(x.from)}</div>`:"";
  const withNew=(col,list)=>E&&E.isNew&&E.col===col?[...list,E.data]:list;
  const FT=[["charge","Charge"],["scheduledSaving","Épargne programmée"]], EM=[["amount","Montant fixe"],["percentage","Pourcentage de la base"]];
  const envLabel=id=>S.envelopes.find(e=>e.id===id)?.label||"Aucune";
  const add=(k,l)=>`<button class="btn" data-new="${k}" ${busy?"disabled":""}>${l}</button>`;
  const T=S.setTab; let body="";
  if(T==="fixed"){
    const rows=withNew("fixed",S.fixed).map(f=>editing("fixed",f.id)
      ?`<tr><td>${inp("label",E.data.label,'placeholder="Loyer"')}</td><td>${sel("type",E.data.type,FT)}</td><td>${inp("amount",toInput(E.data.amount),'inputmode="decimal"')}</td>${ok}</tr>`
      :`<tr><td>${esc(f.label)}${status(f)}</td><td>${f.type==="charge"?"Charge":`<span class="chip acc">Épargne programmée</span>`}</td>
        <td class="num">${eur(f.amount)}${f.next?`<div class="sub">${eur(f.next.amount)} en ${mShort(S.cur+1)}</div>`:""}</td>${acts("fixed",f)}</tr>`).join("");
    const total=S.fixed.filter(f=>activeAt(f,S.cur)).reduce((a,f)=>a+f.amount,0);
    body=`<div class="panel"><div class="scroll"><table><thead><tr><th>Libellé</th><th>Type</th><th class="num">Montant mensuel</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="tfoot">${add("fixed","Ajouter un poste fixe")}<span class="sub">Total mensuel <strong class="amount" style="font-size:17px;color:var(--ink);margin-left:6px">${eur(total)}</strong></span></div></div>`;
  }
  if(T==="env"){
    const pctSum=S.envelopes.filter(e=>activeAt(e,S.cur)&&(e.next?.mode??e.mode)==="percentage").reduce((a,e)=>a+(e.next?.value??e.value),0);
    const rows=withNew("env",S.envelopes).map(e=>editing("env",e.id)
      ?`<tr><td>${inp("label",E.data.label,'placeholder="Sorties et loisirs"')}</td><td>${sel("mode",E.data.mode,EM)}</td>
        <td>${inp("value",E.data.mode==="amount"?toInput(E.data.value):E.data.value,'inputmode="decimal"')}${E.data.mode==="percentage"?'<div class="sub">en %</div>':""}</td>${ok}</tr>`
      :`<tr><td>${esc(e.label)}${status(e)}</td><td>${e.mode==="amount"?"Montant fixe":"Pourcentage de la base"}</td>
        <td class="num">${e.mode==="amount"?eur(e.value):e.value+" %"}${e.next?`<div class="sub">${e.next.mode==="amount"?eur(e.next.value):e.next.value+" %"} en ${mShort(S.cur+1)}</div>`:""}</td>${acts("env",e)}</tr>`).join("");
    body=`<div class="panel"><div class="scroll"><table><thead><tr><th>Libellé</th><th>Mode</th><th class="num">Valeur</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="tfoot">${add("env","Ajouter une enveloppe")}<span class="sub">Pourcentages attribués : ${pctSum} %, non attribué : ${100-pctSum} %</span></div></div>
      ${pctSum>100?`<div class="warn">La somme des pourcentages dépasse 100 %.</div>`:""}`;
  }
  if(T==="prov"){
    const rows=withNew("prov",S.provisions).map(q=>editing("prov",q.id)
      ?`<tr><td>${inp("label",E.data.label,'placeholder="Vacances"')}</td><td>${q.type==="deadline"?"À échéance":"Réserve"}</td>
        <td>${inp("target",toInput(E.data.target),'inputmode="decimal"')}</td>
        <td>${q.type==="deadline"?inp("duration",E.data.duration,'type="number" min="1"')+'<div class="sub">mois</div>':inp("monthly",toInput(E.data.monthly),'inputmode="decimal"')+'<div class="sub">par mois</div>'}</td><td></td>${ok}</tr>`
      :`<tr><td>${esc(q.label)}</td><td>${q.type==="deadline"?"À échéance":`<span class="chip acc">Réserve</span>`}</td><td class="num">${eur(q.target)}</td>
        <td>${q.type==="deadline"?`${q.duration} mois<div class="sub">${mShort(q.start)} à ${mLabel(dueMonth(q))}</div>`:`${eur(q.monthly)} par mois`}</td>
        <td>${q.status==="closed"?`<span class="chip">Clôturée</span>`:"Active"}</td>${q.status==="closed"?"<td></td>":acts("prov",q)}</tr>`).join("");
    body=`<div class="panel"><div class="scroll"><table><thead><tr><th>Libellé</th><th>Type</th><th class="num">Objectif</th><th>Durée ou mensualité</th><th>Statut</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="tfoot"><span style="display:flex;gap:8px;flex-wrap:wrap">${add("deadline","Ajouter une provision à échéance")}${add("reserve","Ajouter une réserve")}</span></div></div>
      <p class="note" style="margin-top:10px">Les modifications de provisions s'appliquent à la prochaine ouverture : la règle pour le mois en cours (R7) n'est pas encore tranchée.</p>`;
  }
  if(T==="cat"){
    const rows=withNew("cat",S.categories).map(c=>editing("cat",c.id)
      ?`<tr><td><span style="display:flex;gap:8px;align-items:center"><input type="color" data-f="color" value="${E.data.color}" aria-label="Couleur" style="width:40px;min-width:40px;padding:2px;height:34px">${inp("label",E.data.label,'placeholder="Courses"')}</span></td>
        <td>${sel("def",E.data.def,[["","Aucune, au choix à chaque saisie"],...S.envelopes.filter(e=>activeAt(e,S.cur)).map(e=>[e.id,e.label])])}</td>${ok}</tr>`
      :`<tr><td><span class="level">${catDot(c)}${esc(c.label)}</span>${c.archived?` <span class="chip">Archivée</span> <button class="btn link" data-reactivate="${c.id}">Réactiver</button>`:""}</td>
        <td>${c.def?esc(envLabel(c.def)):`<span class="sub">Au choix à chaque saisie</span>`}</td>${c.archived?"<td></td>":acts("cat",c)}</tr>`).join("");
    body=`<div class="panel"><div class="scroll"><table><thead><tr><th>Catégorie</th><th>Enveloppe par défaut</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="tfoot">${add("cat","Ajouter une catégorie")}</div></div>`;
  }
  const tabs=[["fixed","Postes fixes"],["env","Enveloppes"],["prov","Provisions"],["cat","Catégories"]];
  return `<div class="page-head"><div><h1>Paramètres</h1><p class="lead">${open?`Si tu modifies un montant, Pécule te demandera s'il s'applique à ${mLabel(S.cur)} ou au mois suivant.`:"Aucun mois ouvert : les modifications s'appliqueront à la prochaine ouverture."}</p></div></div>
    <div class="subnav" role="tablist">${tabs.map(([k,l])=>`<button data-settab="${k}" aria-current="${S.setTab===k}" ${busy?"disabled":""}>${l}</button>`).join("")}</div>${body}`;
}

// ===== Évènements =====
const root=document.documentElement;
function goTab(t){S.tab=t;S.edit=null;S.closing=S.closing&&t==="month";render();window.scrollTo(0,0);}
function submitOpen(){
  const inp=document.querySelector('#openf [name="income"]'), v=toCents(inp.value);
  if(v>0) openMonth(v); else {document.getElementById("openerr").hidden=false;inp.focus();}
}
function submitAuth(step){
  const f=document.getElementById("authf"), err=document.getElementById("autherr");
  if(step===1){ const e=f.querySelector('[name=email]').value.trim(), p=f.querySelector('[name=password]').value;
    if(!e||!p){err.hidden=false;return;} S.authStep=2; render(); document.querySelector('[name=code]')?.focus(); }
  else { const c=f.querySelector('[name=code]')?.value.trim()||"";
    if(!/^\d{6}$/.test(c)&&step===2){err.hidden=false;return;} S.auth=true; render(); toast("Connexion réussie"); }
}
document.addEventListener("click",e=>{
  const tr=e.target.closest("tr[data-hist]"); if(tr){S.histMonth=+tr.dataset.hist;render();window.scrollTo(0,0);return;}
  const t=e.target.closest("button"); if(!t||dlg.contains(t)) return;
  if(t.dataset.themeSet){const v=t.dataset.themeSet; v==="auto"?root.removeAttribute("data-theme"):root.setAttribute("data-theme",v);
    document.querySelectorAll("[data-theme-set]").forEach(x=>x.setAttribute("aria-pressed",String(x===t)));return;}
  if(t.dataset.tab){ if(t.dataset.tab==="hist"){S.histMonth=null;S.histYear=null;} if(t.dataset.tab==="ops") S.opsMonth=null; goTab(t.dataset.tab); }
  if(t.dataset.opsm!==undefined){S.opsMonth=+t.dataset.opsm;render();}
  if(t.dataset.histm!==undefined){S.histMonth=+t.dataset.histm;render();}
  if(t.dataset.opsjump!==undefined){S.opsMonth=+t.dataset.opsjump;S.tab="ops";render();window.scrollTo(0,0);}
  if(t.dataset.settab){S.setTab=t.dataset.settab;render();}
  if(t.dataset.add) opForm(t.dataset.add);
  if(t.dataset.pay) opForm("contribution",null,"prov:"+t.dataset.pay);
  if(t.dataset.spend) opForm("expense",null,"prov:"+t.dataset.spend);
  if(t.dataset.gotoNew){S.tab="settings";S.setTab="prov";startNew(t.dataset.gotoNew);}
  if(t.dataset.del){S.ops=S.ops.filter(o=>o.id!==t.dataset.del);render();toast("Opération supprimée");}
  if(t.dataset.edit){const o=S.ops.find(x=>x.id===t.dataset.edit);opForm(o.kind,o);}
  if(t.dataset.editItem){const [c,id]=t.dataset.editItem.split(":");startEdit(c,id);}
  if(t.dataset.delItem){const [c,id]=t.dataset.delItem.split(":");askDelete(c,id);}
  if(t.dataset.reactivate){S.categories.find(c=>c.id===t.dataset.reactivate).archived=false;render();}
  if(t.dataset.unarch){const x=[...S.fixed,...S.envelopes].find(y=>y.id===t.dataset.unarch);delete x.archivedFrom;render();}
  if(t.dataset.new) startNew(t.dataset.new);
  const a=t.dataset.act;
  if(a==="auth1") submitAuth(1);
  if(a==="auth2") submitAuth(t.textContent.includes("secours")?3:2);
  if(a==="authback"){S.authStep=1;render();}
  if(a==="logout"){S.auth=false;S.authStep=1;render();}
  if(a==="open") submitOpen();
  if(a==="closing"){S.closing=true;render();window.scrollTo(0,0);}
  if(a==="cancelclose"){S.closing=false;render();}
  if(a==="close") closeMonth();
  if(a==="reopen") reopenMonth(+t.dataset.month);
  if(a==="histback"){S.histMonth=null;render();}
  if(a==="simulate"){S.today=S.cur+1;render();}
  if(a==="validate") validateEdit();
  if(a==="cancel-edit"){S.edit=null;render();}
  if(a==="demo"){
    [{kind:"contribution",amount:10000,src:"prov:p1",date:dayIn(S.cur,3),place:"",desc:"Virement",cat:""},
     {kind:"expense",amount:1500,src:"env:e1",date:dayIn(S.cur,5),place:"Monoprix",desc:"Produits d'entretien",cat:"c2"},
     {kind:"expense",amount:4230,src:"env:e1",date:dayIn(S.cur,8),place:"Biocoop",desc:"Courses de la semaine",cat:"c1"},
     {kind:"expense",amount:2500,src:"env:e2",date:dayIn(S.cur,13),place:"Le Bistrot",desc:"Dîner avec une amie",cat:"c7"},
     {kind:"expense",amount:10000,src:"env:e3",date:dayIn(S.cur,23),place:"Boutique Nuances",desc:"Vêtements",cat:"c10"}]
     .forEach(o=>{o.id=uid("o");o.month=S.cur;S.ops.push(o)}); S.snap.fixed.slice(0,7).forEach(f=>f.done=true); render();
  }
});
document.addEventListener("change",e=>{
  const t=e.target, d=t.dataset;
  if(d.done){S.snap.fixed.find(x=>x.id===d.done).done=t.checked;render();return;}
  if(d.alloc){const v=toCents(t.value);if(v>0)S.alloc[d.alloc]=v;else delete S.alloc[d.alloc];render();return;}
  if(t.id==="hyear"){S.histYear=+t.value;render();return;}
  if(t.id==="fcat"){S.fcat=t.value;document.getElementById("opstable").innerHTML=opsTable();return;}
  if(d.f&&S.edit){
    const D=S.edit.data, f=d.f;
    if(f==="label") D.label=t.value.trim();
    if(f==="type") D.type=t.value;
    if(f==="def") D.def=t.value;
    if(f==="color") D.color=t.value.toUpperCase();
    if(["amount","target","monthly"].includes(f)) D[f]=toCents(t.value);
    if(f==="duration") D.duration=Math.max(1,+t.value||1);
    if(f==="value") D.value=D.mode==="amount"?toCents(t.value):Math.max(0,parseFloat(String(t.value).replace(",","."))||0);
    if(f==="mode"){D.mode=t.value;D.value=0;render();}
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.closest?.("#openf")&&t.name==="income"){
    const fx=S.fixed.filter(x=>activeAt(x,S.cur)).reduce((s,x)=>s+(x.next?.amount??x.amount),0);
    document.getElementById("rav").textContent=eur(toCents(t.value)-fx);
  }
  if(t.id==="search"){S.q=t.value;document.getElementById("opstable").innerHTML=opsTable();}
});
document.addEventListener("keydown",e=>{
  const t=e.target, typing=["INPUT","SELECT","TEXTAREA"].includes(t.tagName);
  if(e.key==="Enter"&&t.matches?.("tr[data-hist]")){S.histMonth=+t.dataset.hist;render();return;}
  if(e.key==="Enter"){
    if(t.closest?.("#authf")){e.preventDefault();submitAuth(S.authStep);return;}
    if(t.name==="income"&&t.closest("#openf")){e.preventDefault();submitOpen();return;}
    if(t.closest?.("#opf")&&t.tagName==="INPUT"){e.preventDefault();dlg._opSubmit();return;}
    if(t.dataset?.f&&S.edit){e.preventDefault();t.blur();validateEdit();return;}
  }
  if(e.key==="Escape"&&t.dataset?.f&&S.edit){S.edit=null;render();return;}
  if(typing||dlg.open||!S.auth||e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key.toLowerCase();
  if(k==="n"&&S.status==="open"&&!S.closing){e.preventDefault();opForm("expense");}
  if(k==="v"&&S.status==="open"&&!S.closing){e.preventDefault();opForm("contribution");}
  if(["1","2","3","4","5"].includes(k)){const tab=["month","ops","prov","hist","settings"][+k-1]; if(tab==="hist"){S.histMonth=null;S.histYear=null;} if(tab==="ops") S.opsMonth=null; goTab(tab);}
  if(e.key==="ArrowLeft"||e.key==="ArrowRight"){
    const d=e.key==="ArrowLeft"?-1:1;
    if(S.tab==="ops"){const m=opsM()+d; if(m>=firstMonth()&&m<=S.cur){S.opsMonth=m;render();}}
    if(S.tab==="hist"&&S.histMonth!==null){const m=S.histMonth+d; if(S.history.some(h=>h.month===m)){S.histMonth=m;render();}}
  }
  if(k==="/"){e.preventDefault();goTab("ops");document.getElementById("search")?.focus();}
});
dlg.addEventListener("close",()=>{ if(dlg.querySelector("[data-eff]")) render(); });
render();
</script>
</body>
</html>
